syntax = "proto3";

option csharp_namespace = "VibeRe.Protocol";

package vibere.auth;

import "google/protobuf/timestamp.proto";

// Signs the local user in and out of model providers. Credentials stay on the server.
service Auth {
  rpc GetStatus (GetStatusRequest) returns (GetStatusResponse);

  // Interactive sign-in. The client sends `start`, then answers each `secret_prompt` with a `secret`;
  // the server streams progress and ends with `completed`.
  rpc SignIn (stream SignInRequest) returns (stream SignInResponse);

  rpc SignOut (SignOutRequest) returns (SignOutResponse);
}

message ProviderInfo {
  string id = 1;
  string display_name = 2;
  // Environment variable on the server that takes precedence over the stored credential.
  optional string api_key_environment_variable = 3;
}

enum CredentialSource {
  CREDENTIAL_SOURCE_NONE = 0;
  CREDENTIAL_SOURCE_ENVIRONMENT = 1;
  CREDENTIAL_SOURCE_STORE = 2;
}

enum AccountStatus {
  ACCOUNT_STATUS_SIGNED_OUT = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_REJECTED = 2;
  ACCOUNT_STATUS_SUBSCRIPTION_REQUIRED = 3;
}

message GetStatusRequest {
  string provider_id = 1;
}

message GetStatusResponse {
  ProviderInfo provider = 1;
  CredentialSource active_source = 2;
  AccountStatus account_status = 3;
  // Set when the provider reported account details.
  optional string plan = 4;
  // Explains a rejected or restricted credential.
  optional string message = 5;
}

enum SignInStage {
  SIGN_IN_STAGE_UNSPECIFIED = 0;
  SIGN_IN_STAGE_OPENING_BROWSER = 1;
  SIGN_IN_STAGE_WAITING_FOR_USER = 2;
  SIGN_IN_STAGE_EXCHANGING = 3;
  SIGN_IN_STAGE_COMPLETED = 4;
}

message SignInRequest {
  oneof message {
    StartSignIn start = 1;
    SecretReply secret = 2;
  }
}

message StartSignIn {
  string provider_id = 1;
  // Sign-in method, e.g. `browser` or `api-key`. Unset for the provider's preferred method.
  optional string method = 2;
}

message SecretReply {
  // Unset when the user declined to enter a secret.
  optional string secret = 1;
}

message SignInResponse {
  oneof message {
    SignInStage stage = 1;
    OpenSignInUrl open_sign_in_url = 2;
    SecretPrompt secret_prompt = 3;
    SignInCompleted completed = 4;
  }
}

message OpenSignInUrl {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message SecretPrompt {
  string prompt = 1;
}

message SignInCompleted {
  ProviderInfo provider = 1;
  CredentialSource active_source = 2;
}

message SignOutRequest {
  string provider_id = 1;
}

message SignOutResponse {
  ProviderInfo provider = 1;
  // False when there was no stored credential.
  bool removed = 2;
  CredentialSource active_source = 3;
}
